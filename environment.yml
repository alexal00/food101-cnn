name: food101-cnn
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip>=23
  - ipykernel
  - jupyter
  - jupyterlab
  - matplotlib
  - nbconvert
  - nbformat
  - numpy
  - pandas
  - pillow
